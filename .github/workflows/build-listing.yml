name: Build Repo Listing

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - source.json
            - Website/**
            - .github/workflows/build-listing.yml
    repository_dispatch:
        types:
            - packages-updated

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

env:
    listPublishDirectory: Website
    pathToCi: ci

jobs:
    build-listing:
        name: Build and deploy listing
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout listing
              uses: actions/checkout@v4

            - name: Checkout listing builder
              uses: actions/checkout@v4
              with:
                  repository: vrchat-community/package-list-action
                  path: ${{ env.pathToCi }}
                  clean: false

            - name: Restore build cache
              uses: actions/cache@v4
              with:
                  path: |
                      ${{ env.pathToCi }}/.nuke/temp
                      ~/.nuget/packages
                  key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

            - name: Build package listing and website
              run: >-
                  ${{ env.pathToCi }}/build.cmd BuildRepoListing
                  --root ${{ env.pathToCi }}
                  --list-publish-directory $GITHUB_WORKSPACE/${{ env.listPublishDirectory }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload website
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ${{ env.listPublishDirectory }}

            - name: Deploy website
              id: deployment
              uses: actions/deploy-pages@v4
